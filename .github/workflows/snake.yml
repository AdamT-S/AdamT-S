name: Generate Snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Generate snake
        uses: Platane/snk@v3
        with:
          github_user_name: AdamT-S
          outputs: |
            dist/github-contribution-grid-snake.svg?color_snake=%239b5de5&color_dots=%23082c3f,%23065272,%23056f97,%230293c7,%2300b4f1
            dist/github-contribution-grid-snake-dark.svg?color_snake=%239b5de5&color_dots=%23082c3f,%23065272,%23056f97,%230293c7,%2300b4f1
            
      - name: Publish snake
        uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
